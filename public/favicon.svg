<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners and Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>

  <!-- Architectural Vertex Peak (Upper Roofline) -->
  <path d="M32 12L12 28L17 31.5L32 19.5L47 31.5L52 28L32 12Z" fill="url(#goldLight)" filter="url(#glow)"/>

  <!-- Architectural Penthouse Main Body Framing -->
  <path d="M32 23L16 35V50H48V35L32 23Z" fill="none" stroke="url(#gold)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The Vertex "V" Chevron Emblem -->
  <path d="M22 36L32 46L42 36" fill="none" stroke="url(#goldLight)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Keystone Center Emblem -->
  <circle cx="32" cy="31" r="2.2" fill="#ffffff"/>
</svg>

