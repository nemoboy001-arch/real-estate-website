<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners and Bold Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="3"/>

  <!-- Bold Architectural Vertex Pinnacle / Main Roof -->
  <path d="M32 9L7 28L14 33L32 19L50 33L57 28L32 9Z" fill="url(#gold)" filter="url(#shadow)"/>

  <!-- Bold Architectural Penthouse Pillars & Foundation -->
  <path d="M15 36V51H23V42H41V51H49V36" fill="url(#gold)"/>

  <!-- Extra Bold Vertex "V" Monogram -->
  <path d="M20 31L32 46L44 31" fill="none" stroke="url(#gold)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Keystone Jewel -->
  <circle cx="32" cy="27" r="3" fill="#ffffff"/>
</svg>
