<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgPA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldPA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowPA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners and Bold Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgPA)" stroke="url(#goldPA)" stroke-width="3"/>

  <!-- Bold Architectural Pinnacle / Main Roof -->
  <path d="M32 9L7 28L14 33L32 19L50 33L57 28L32 9Z" fill="url(#goldPA)" filter="url(#shadowPA)"/>

  <!-- Bold Architectural Pillars & Base -->
  <path d="M15 36V51H23V42H41V51H49V36" fill="url(#goldPA)"/>

  <!-- Stylized Bold "PA" (Peculiar Aesthetics) Architectural Monogram -->
  <!-- Letter P -->
  <path d="M22 47V31H29C32.5 31 34.5 33 34.5 36C34.5 39 32.5 41 29 41H22" fill="none" stroke="url(#goldPA)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Letter A -->
  <path d="M34 47L42 31L48 47" fill="none" stroke="url(#goldPA)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37 42H45" stroke="url(#goldPA)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Center Keystone Diamond -->
  <circle cx="32" cy="24" r="2.5" fill="#ffffff"/>
</svg>
